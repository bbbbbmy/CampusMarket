# CI：每次 push / PR 时跑后端单测 + 集成测试
name: backend-ci

on:
  push:
    branches: [main, "v0.2.*"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install (skip tests)
        run: mvn -B -ntp -f backend/pom.xml -DskipTests install

      - name: Run unit + integration tests
        run: mvn -B -ntp -f backend/pom.xml -pl campus-app test

      - name: Publish Surefire Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/campus-app/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true